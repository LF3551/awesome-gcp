name: Entry check

# pull_request_target runs this file from the default branch. The pull request code is never checked out
# or executed: its readme.md is read as text through the API, and the submitted link is requested
# in a job that has no write access and no token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reset:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Drop any earlier approval, a new commit must be checked again
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label automerge-ready || true
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto || true

  parse:
    needs: reset
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      url: ${{ steps.parse.outputs.url }}
      text: ${{ steps.parse.outputs.text }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: parse
        run: node .github/scripts/validate-pr.mjs parse

  probe:
    needs: parse
    if: needs.parse.outputs.url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outputs.result }}
    env:
      ENTRY_URL: ${{ needs.parse.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: probe
        run: echo "result=$(node .github/scripts/probe.mjs "$ENTRY_URL" | head -n 1)" >> "$GITHUB_OUTPUT"

  finalize:
    needs: [parse, probe]
    if: always() && needs.parse.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TEXT_RESULT: ${{ needs.parse.outputs.text }}
      PROBE_RESULT: ${{ needs.probe.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node .github/scripts/validate-pr.mjs finalize
      - name: Comment the result
        run: gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file report.md --edit-last --create-if-none
      - name: Label and enable auto-merge for the checked commit only
        env:
          CHECK_OK: ${{ steps.check.outputs.ok }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "A newer commit exists; it will be checked by its own run"
            exit 0
          fi
          gh label create automerge-ready --repo "$REPO" --color 0E8A16 --description "Passed the automated entry check" --force
          gh label create needs-review --repo "$REPO" --color D93F0B --description "Needs a manual review" --force
          if [ "$CHECK_OK" = "true" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label automerge-ready --remove-label needs-review
            gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-review --remove-label automerge-ready
          fi
